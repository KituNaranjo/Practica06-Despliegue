# /etc/nginx/sites-available/default
# Nginx sirve el build de Angular y hace proxy inverso de /api hacia PM2 (puerto 3000)
upstream empleados_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/empleados-app/current/frontend/dist/frontend/browser;
    index index.html;

    # API REST -> Node.js (el puerto 3000 nunca se expone al público)
    location /api/ {
        proxy_pass http://empleados_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Angular: cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash -> caché larga
    location ~* \.(js|css|ico|png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
